[build]
  publish = "."
  # Automatically points canonical links, sitemap and share images at your live address
  # (your Netlify URL, or your custom domain once connected). Nothing to edit by hand.
  command = "sed -i \"s|https://lordsartcrafts.netlify.app|${URL:-https://lordsartcrafts.netlify.app}|g\" index.html robots.txt sitemap.xml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
